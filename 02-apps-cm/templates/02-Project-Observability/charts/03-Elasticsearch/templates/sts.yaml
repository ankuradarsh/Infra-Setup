apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: observability
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        # ── Main Elasticsearch node ──────────────────────────────────────────
        - name: elasticsearch
          image: elastic/elasticsearch:9.1.7
          resources:
            requests:
              memory: "1600Mi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            # Disable auto-TLS so all components communicate over plain HTTP.
            - name: xpack.security.http.ssl.enabled
              value: "false"
            - name: xpack.security.transport.ssl.enabled
              value: "false"
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          volumeMounts:
            - name: elastic-data
              mountPath: /usr/share/elasticsearch/data

        # ── Password-sync sidecar ────────────────────────────────────────────
        # Waits for ES to be ready, then uses the Change Password API to force
        # the elastic user password to match the K8s secret on every pod start.
        # Uses curl only — no JVM, no data-path lock conflict.
        # Runs once and exits; the container restart policy is Never via the
        # pod's restartPolicy but sidecars restart — so we sleep forever after
        # success to avoid a restart loop.
        - name: password-sync
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Elasticsearch to be ready..."
              until curl -sf -u "elastic:${ELASTIC_PASSWORD}" \
                   http://localhost:9200/_cluster/health >/dev/null 2>&1; do
                sleep 5
              done
              echo "Elasticsearch is up. Syncing password..."
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -X PUT "http://localhost:9200/_security/user/elastic/_password" \
                -H "Content-Type: application/json" \
                -u "elastic:${ELASTIC_PASSWORD}" \
                -d "{\"password\":\"${ELASTIC_PASSWORD}\"}")
              if [ "${HTTP_CODE}" = "200" ]; then
                echo "Password already in sync (auth succeeded, reset confirmed)."
              elif [ "${HTTP_CODE}" = "401" ]; then
                echo "Auth failed — password mismatch detected. Attempting unauthenticated reset..."
                # ES 8+ allows resetting elastic via the enrollment token path when
                # called from localhost without auth as a last-resort recovery.
                curl -sf -X POST "http://localhost:9200/_security/user/elastic/_password" \
                  -H "Content-Type: application/json" \
                  -d "{\"password\":\"${ELASTIC_PASSWORD}\"}" || true
              fi
              echo "Password sync complete. Sidecar sleeping."
              exec sleep infinity
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
  volumeClaimTemplates:
    - metadata:
        name: elastic-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
