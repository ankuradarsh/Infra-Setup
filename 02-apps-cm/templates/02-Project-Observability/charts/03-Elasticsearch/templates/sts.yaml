apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  namespace: observability
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      app: elasticsearch
  template:
    metadata:
      labels:
        app: elasticsearch
    spec:
      containers:
        - name: elasticsearch
          image: elastic/elasticsearch:9.1.7
          resources:
            requests:
              memory: "1600Mi"
              cpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
          ports:
            - containerPort: 9200
          env:
            - name: discovery.type
              value: single-node
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    # Wait until the ES HTTP API is accepting connections,
                    # then force-reset the elastic user password to match
                    # the current value of the secret. This ensures the
                    # running password stays in sync even when the PVC
                    # already has data from a previous boot.
                    until curl -sf http://localhost:9200 >/dev/null 2>&1; do
                      sleep 5
                    done
                    echo "${ELASTIC_PASSWORD}" | \
                      /usr/share/elasticsearch/bin/elasticsearch-reset-password \
                        -u elastic --stdin --batch --url http://localhost:9200
          volumeMounts:
            - name: elastic-data
              mountPath: /usr/share/elasticsearch/data
  volumeClaimTemplates:
    - metadata:
        name: elastic-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
