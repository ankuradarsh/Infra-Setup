apiVersion: v1
kind: ConfigMap
metadata:
  name: kibana-helm-scripts
  namespace: observability
data:
  manage-es-token.js: |
    const http = require('http');
    const https = require('https');
    const fs = require('fs');

    function getEnvVar(name, required = true) {
      if (!process.env[name]) {
        if (required) throw new Error(name + ' missing');
        return null;
      }
      return process.env[name];
    }

    // Detect protocol
    const esUrl = getEnvVar('ELASTICSEARCH_URL');
    const isHttps = esUrl.startsWith('https://');
    const esClient = isHttps ? https : http;
    const esAuth = getEnvVar('ELASTICSEARCH_USERNAME') + ':' + getEnvVar('ELASTICSEARCH_PASSWORD');

    // Optional CA for Elasticsearch
    let esCa = undefined;
    if (isHttps) {
      const caPath = getEnvVar('ELASTICSEARCH_SSL_CERTIFICATEAUTHORITIES', false);
      if (caPath) esCa = fs.readFileSync(caPath);
    }

    // Kubernetes in-cluster API
    const k8sHost = process.env.KUBERNETES_SERVICE_HOST;
    const k8sPort = process.env.KUBERNETES_SERVICE_PORT_HTTPS;
    const namespace = "observability";
    const secretName = "kibana-es-serviceaccount-token";

    const k8sToken = fs.readFileSync('/run/secrets/kubernetes.io/serviceaccount/token', 'utf8').trim();
    const k8sCa   = fs.readFileSync('/run/secrets/kubernetes.io/serviceaccount/ca.crt', 'utf8');

    // Build a reusable https.Agent that trusts the cluster CA
    const k8sAgent = new https.Agent({ ca: k8sCa });

    function request(url, options, body) {
      const isHttpsUrl = url.startsWith('https://');
      const mod = isHttpsUrl ? https : http;
      // Inject the cluster CA agent for all K8s API calls
      if (isHttpsUrl) options = Object.assign({ agent: k8sAgent }, options);
      return new Promise((resolve, reject) => {
        const req = mod.request(url, options, res => {
          let data = '';
          res.on('data', d => data += d);
          res.on('end', () => {
            resolve({ status: res.statusCode, body: data });
          });
        });
        req.on('error', reject);
        if (body) req.write(body);
        req.end();
      });
    }

    async function esRequest(method) {
      const res = await request(esUrl, { method, auth: esAuth, ca: esCa });
      if (res.status >= 200 && res.status < 300) return res.body;
      if (res.status === 404 && method === 'DELETE') return null; // already gone — fine
      throw new Error(`ES ${method} ${esUrl} → ${res.status}: ${res.body}`);
    }

    async function k8sSecretExists() {
      const res = await request(
        `https://${k8sHost}:${k8sPort}/api/v1/namespaces/${namespace}/secrets/${secretName}`,
        { method: 'GET', headers: { Authorization: `Bearer ${k8sToken}` } }
      );
      return res.status === 200;
    }

    async function createOrPatchK8sSecret(tokenValue) {
      const payload = JSON.stringify({
        apiVersion: "v1",
        kind: "Secret",
        metadata: { name: secretName, namespace },
        type: "Opaque",
        // key MUST match what the Kibana Deployment reads: "password"
        data: { password: Buffer.from(tokenValue).toString('base64') }
      });

      const exists = await k8sSecretExists();

      if (exists) {
        console.log("Secret already exists — patching");
        const res = await request(
          `https://${k8sHost}:${k8sPort}/api/v1/namespaces/${namespace}/secrets/${secretName}`,
          {
            method: 'PATCH',
            headers: {
              Authorization: `Bearer ${k8sToken}`,
              'Content-Type': 'application/strategic-merge-patch+json'
            }
          },
          payload
        );
        if (res.status < 200 || res.status >= 300)
          throw new Error(`K8s PATCH secret → ${res.status}: ${res.body}`);
      } else {
        console.log("Creating K8s secret");
        const res = await request(
          `https://${k8sHost}:${k8sPort}/api/v1/namespaces/${namespace}/secrets`,
          {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${k8sToken}`,
              'Content-Type': 'application/json'
            }
          },
          payload
        );
        if (res.status < 200 || res.status >= 300)
          throw new Error(`K8s POST secret → ${res.status}: ${res.body}`);
      }
    }

    async function create() {
      console.log("Deleting old ES service account token (if exists)");
      await esRequest('DELETE'); // 404 is tolerated

      console.log("Creating new ES service account token");
      const raw = await esRequest('POST');
      const token = JSON.parse(raw).token.value;

      await createOrPatchK8sSecret(token);
      console.log("Done — kibana-es-serviceaccount-token secret is ready");
    }

    async function clean() {
      console.log("Deleting ES service account token");
      await esRequest('DELETE');

      console.log("Deleting K8s secret");
      const res = await request(
        `https://${k8sHost}:${k8sPort}/api/v1/namespaces/${namespace}/secrets/${secretName}`,
        {
          method: 'DELETE',
          headers: { Authorization: `Bearer ${k8sToken}` }
        }
      );
      if (res.status >= 200 && res.status < 300 || res.status === 404) {
        console.log("Done");
      } else {
        throw new Error(`K8s DELETE secret → ${res.status}: ${res.body}`);
      }
    }

    const cmd = process.argv[2];
    if (cmd === 'create') {
      create().catch(e => { console.error(e); process.exit(1); });
    } else if (cmd === 'clean') {
      clean().catch(e => { console.error(e); process.exit(1); });
    } else {
      console.error("Unknown command: " + cmd);
      process.exit(1);
    }
