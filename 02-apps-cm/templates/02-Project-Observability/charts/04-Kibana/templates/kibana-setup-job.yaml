apiVersion: batch/v1
kind: Job
metadata:
  name: kibana-setup
  namespace: observability
spec:
  # Self-delete 30s after completion so ArgoCD recreates it on the next sync,
  # ensuring index patterns are always up-to-date with the ConfigMap.
  ttlSecondsAfterFinished: 30
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: kibana-token-sa
      restartPolicy: OnFailure
      initContainers:
        # Wait for Kibana to be fully available before running setup
        - name: wait-for-kibana
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Kibana to be available..."
              until curl -sf -u "elastic:${ELASTIC_PASSWORD}" \
                   "http://kibana.observability.svc.cluster.local:5601/api/status" \
                   2>/dev/null | grep -q '"level":"available"'; do
                echo "  Kibana not ready yet, retrying in 10s..."
                sleep 10
              done
              echo "Kibana is ready."
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
      containers:
        - name: setup
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - /scripts/setup.sh
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: kibana-setup-script
            defaultMode: 0755
