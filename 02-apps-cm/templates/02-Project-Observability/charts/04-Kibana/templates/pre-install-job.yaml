apiVersion: batch/v1
kind: Job
metadata:
  name: create-kibana-token
  namespace: observability
spec:
  # Re-run on upgrade by bumping this value (ArgoCD will replace the job).
  backoffLimit: 10
  template:
    spec:
      serviceAccountName: kibana-token-sa
      restartPolicy: OnFailure
      initContainers:
        # Step 1 — wait for ESO to sync the credentials secret from Vault.
        - name: wait-for-credentials
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for secret elasticsearch-credentials to be ready..."
              until kubectl get secret elasticsearch-credentials -n observability \
                    -o jsonpath='{.data.password}' 2>/dev/null | grep -q '.'; do
                echo "  secret not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Secret is ready."

        # Step 2 — wait for Elasticsearch security subsystem to be fully ready.
        # nc checks TCP, then curl checks the security API with credentials.
        # Both must succeed before the token-creation script runs.
        - name: wait-for-elasticsearch
          image: curlimages/curl:8.7.1
          command:
            - /bin/sh
            - -c
            - |
              ES="http://elasticsearch.observability.svc.cluster.local:9200"
              echo "Waiting for Elasticsearch TCP port..."
              until nc -z elasticsearch.observability.svc.cluster.local 9200 2>/dev/null; do
                sleep 5
              done
              echo "Port open. Waiting for security API to be ready..."
              until curl -sf -u "elastic:${ELASTIC_PASSWORD}" \
                   "${ES}/_security/user/elastic" >/dev/null 2>&1; do
                echo "  security API not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Elasticsearch security API is ready."
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
      containers:
        - name: create-token
          image: node:20-alpine
          command: ["node"]
          args:
            - /helm-scripts/manage-es-token.js
            - create
          env:
            - name: ELASTICSEARCH_USERNAME
              value: elastic
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch.observability.svc.cluster.local:9200/_security/service/elastic/kibana/credential/token/kibana-token"
          volumeMounts:
            - name: scripts
              mountPath: /helm-scripts
      volumes:
        - name: scripts
          configMap:
            name: kibana-helm-scripts
            defaultMode: 0755
