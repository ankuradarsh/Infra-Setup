apiVersion: batch/v1
kind: Job
metadata:
  name: create-kibana-token
  namespace: observability
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: kibana-token-sa
      restartPolicy: Never
      containers:
      - name: create-token
        image: node:20-alpine
        command: ["node"]
        args:
          - /helm-scripts/manage-es-token.js
          - create
        env:
        - name: ELASTICSEARCH_USERNAME
          value: elastic
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: elasticsearch-credentials
              key: password
        - name: ELASTICSEARCH_URL
          value: "http://elasticsearch.observability.svc.cluster.local:9200/_security/service/elastic/kibana/credential/token/kibana-token"
        volumeMounts:
        - name: scripts
          mountPath: /helm-scripts
      volumes:
      - name: scripts
        configMap:
          name: kibana-helm-scripts
          defaultMode: 0755
