apiVersion: batch/v1
kind: Job
metadata:
  name: create-kibana-token
  namespace: observability
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: kibana-token-sa
      restartPolicy: Never
      initContainers:
        # Step 1 — wait for ESO to sync the credentials secret from Vault.
        - name: wait-for-credentials
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for secret elasticsearch-credentials to be ready..."
              until kubectl get secret elasticsearch-credentials -n observability \
                    -o jsonpath='{.data.password}' 2>/dev/null | grep -q '.'; do
                echo "  secret not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Secret is ready."

        # Step 2 — wait for Elasticsearch port to be open (TCP check, not HTTP,
        # so a 401 from a secured cluster does not block us).
        - name: wait-for-elasticsearch
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Elasticsearch at elasticsearch.observability.svc.cluster.local:9200..."
              until nc -z elasticsearch.observability.svc.cluster.local 9200 2>/dev/null; do
                echo "  Elasticsearch not ready yet, retrying in 5s..."
                sleep 5
              done
              echo "Elasticsearch port is open."
      containers:
        - name: create-token
          image: node:20-alpine
          command: ["node"]
          args:
            - /helm-scripts/manage-es-token.js
            - create
          env:
            - name: ELASTICSEARCH_USERNAME
              value: elastic
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-credentials
                  key: password
            - name: ELASTICSEARCH_URL
              value: "http://elasticsearch.observability.svc.cluster.local:9200/_security/service/elastic/kibana/credential/token/kibana-token"
          volumeMounts:
            - name: scripts
              mountPath: /helm-scripts
      volumes:
        - name: scripts
          configMap:
            name: kibana-helm-scripts
            defaultMode: 0755
