apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  namespace: observability
data:
  filebeat.yml: |
    filebeat.inputs:

      # ─── Container logs (type: container follows symlinks in /var/log/containers)
      - type: container
        paths:
          - /var/log/containers/*.log
        stream: all

        # Tag every event so it can be identified in Logstash/Kibana
        tags: ["kubernetes", "container-logs"]

    # ─── Kubernetes metadata enrichment ─────────────────────────────────────
    processors:
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: "/var/log/containers/"

      # Drop internal Filebeat/ECS fields that add noise in Kibana
      - drop_fields:
          fields: ["agent", "ecs", "input"]
          ignore_missing: true

      # Tag every event with the cluster name
      - add_fields:
          target: ""
          fields:
            cluster: "k8s-prod"

    # ─── Output to Logstash ──────────────────────────────────────────────────
    output.logstash:
      hosts: ["logstash.observability.svc.cluster.local:5044"]
      loadbalance: true

    # ─── Logging ────────────────────────────────────────────────────────────
    logging.level: info
    logging.to_files: false
